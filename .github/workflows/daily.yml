name: Infos du jour

on:
  schedule:
    # 4h30 UTC = 5h30 (hiver) / 6h30 (été) à Paris. La notification, elle,
    # est programmée pour arriver à 8h00 pile (heure de Paris) via ntfy.
    # Marge volontaire : les crons GitHub ont souvent 10-30 min de retard.
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      notify_now:
        description: "Envoyer la notification immédiatement (au lieu de 8h)"
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  build-deploy-notify:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Récupérer et résumer les infos
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: python -m news.main --out site --no-notify

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Notification (ntfy)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          python -m news.main --notify-from site/data.json \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.notify_now) && '--notify-now' || '' }}
